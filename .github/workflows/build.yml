name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: amigadev/crosstools:m68k-amigaos-gcc10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler version
        run: m68k-amigaos-gcc --version

      - name: Build plugins and release package
        run: make -j4 package EXTRA_CFLAGS=-Werror

      - name: List release package
        run: |
          ls -la build/LW-Plugins-*.lha
          lha l build/LW-Plugins-*.lha

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amiga-lw-plugins
          path: build/LW-Plugins-*.lha

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: amiga-lw-plugins
          path: plugins

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/*
          generate_release_notes: true
